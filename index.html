<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kabar dunia</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bs-primary: #17a2b8;
        --bs-primary-rgb: 23, 162, 184;
        --bs-dark: #212529;
        --light-color: #bdedf5;
      }

      body {
        font-family: "Poppins", sans-serif;
        background-color: var(--light-color);
      }

      /* Navbar */
      .navbar {
        background-color: var(--bs-dark);
      }

      .navbar-brand {
        font-weight: 700;
        font-size: 1.75rem;
      }

      /* Card News */
      .card {
        border: none;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1) !important;
      }

      .card-img-top {
        height: 220px;
        object-fit: cover;
        background-color: #eee;
      }

      .card-title {
        font-weight: 600;
        font-size: 1.15rem;
        line-height: 1.4;
      }

      footer a {
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="#"
          ><i class="fas fa-globe-americas me-2"></i>Kabar Dunia</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a
                class="nav-link category-link"
                href="#"
                data-category="teknologi"
                >Teknologi</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link category-link"
                href="#"
                data-category="olahraga"
                >Olahraga</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link category-link" href="#" data-category="bisnis"
                >Bisnis</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link category-link" href="#" data-category="hiburan"
                >Hiburan</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="container" style="padding-top: 90px">
      <header class="hero-section text-center my-5">
        <h1 class="display-5 fw-bold">Kabar Dunia Terkini</h1>
        <p class="lead text-muted">
          Temukan berita terbaru dan terpopuler di seluruh dunia.
        </p>
      </header>

      <!-- Form Search -->
      <form id="searchForm" class="mb-5">
        <div class="input-group input-group-lg shadow-sm">
          <span class="input-group-text bg-white border-end-0">
            <i class="fas fa-search text-muted"></i>
          </span>
          <input
            type="text"
            id="query"
            placeholder="Contoh: 'Teknologi', 'Olahraga', 'Politik'"
            class="form-control border-start-0"
            style="padding-left: 0"
          />
          <button
            type="submit"
            id="searchButton"
            class="btn btn-primary fw-bold"
          >
            Cari
          </button>
        </div>
      </form>

      <!-- Alert -->
      <div id="alertBox"></div>

      <!-- Loader -->
      <div id="loader" class="text-center my-5" style="display: none">
        <div
          class="spinner-border text-primary"
          role="status"
          style="width: 3rem; height: 3rem"
        >
          <span class="visually-hidden">Memuat...</span>
        </div>
      </div>

      <!-- News Container -->
      <div id="newsCards" class="row"></div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 mt-5 bg-light">
      <p class="mb-1">&copy; 2025 saya News. Dirancang untuk informasi.</p>
      <div>
        <a href="#" class="text-muted mx-2">Tentang</a> |
        <a href="#" class="text-muted mx-2">Kontak</a> |
        <a href="#" class="text-muted mx-2">Kebijakan Privasi</a>
      </div>
    </footer>

    <!-- Bootstrap JS & jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- MAIN SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const searchForm = document.getElementById("searchForm");
        const queryInput = document.getElementById("query");
        const newsCards = document.getElementById("newsCards");
        const alertBox = document.getElementById("alertBox");
        const loader = document.getElementById("loader");

        // ✅ Ganti dengan API Key milikmu dari newsapi.org
        const API_KEY = "8ff42d2058a04b35bb3bc94ff9b72ef7";
 const PROXY = "https://api.allorigins.win/get?url=";
        async function fetchNews(query) {
          loader.style.display = "block";
          newsCards.innerHTML = "";
          alertBox.innerHTML = "";

          const url = `https://newsapi.org/v2/everything?q=${encodeURIComponent(
            query
          )}&sortBy=publishedAt&apiKey=${API_KEY}&language=id`;

          try {
            const response = await fetch(url);
            if (!response.ok)
              throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();

            if (data.status === "error") {
              displayError(data.message);
            } else if (!data.articles || data.articles.length === 0) {
              displayError(
                `Tidak ada berita yang cocok untuk kata kunci "${query}".`
              );
            } else {
              displayNews(data.articles);
            }
          } catch (error) {
            console.error("Fetch Error:", error);
            displayError(
              "Gagal mengambil data berita. Periksa koneksi internet atau API Key Anda."
            );
          } finally {
            loader.style.display = "none";
          }
        }

        function displayError(message) {
          alertBox.innerHTML = `<div class="alert alert-warning text-center">${message}</div>`;
        }

        function displayNews(articles) {
          newsCards.innerHTML = "";

          articles.forEach((article) => {
            if (
              !article.title ||
              !article.description ||
              article.title === "[Removed]"
            )
              return;

            const newsCardHTML = `
                        <div class="col-md-6 col-lg-4 mb-4">
                            <div class="card h-100 shadow-sm rounded-4 overflow-hidden">
                                <img src="${
                                  article.urlToImage ||
                                  "https://via.placeholder.com/400x220.png?text=Gambar+Tidak+Tersedia"
                                }" class="card-img-top" alt="Gambar berita">
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">${article.title}</h5>
                                    <p class="card-text text-muted small">${article.description.substring(
                                      0,
                                      100
                                    )}...</p>
                                    <a href="${
                                      article.url
                                    }" target="_blank" class="btn btn-primary mt-auto fw-bold rounded-pill px-4">Baca Selengkapnya</a>
                                </div>
                                <div class="card-footer bg-transparent border-top">
                                    <small class="text-muted">
                                        <strong>${
                                          article.source.name ||
                                          "Sumber tidak diketahui"
                                        }</strong> - 
                                        ${new Date(
                                          article.publishedAt
                                        ).toLocaleDateString("id-ID", {
                                          day: "numeric",
                                          month: "long",
                                          year: "numeric",
                                        })}
                                    </small>
                                </div>
                            </div>
                        </div>
                    `;
            newsCards.innerHTML += newsCardHTML;
          });
        }

        searchForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const query = queryInput.value.trim();
          if (query) {
            fetchNews(query);
          } else {
            displayError("Silakan masukkan kata kunci pencarian.");
          }
        });

        // ✅ jQuery Event untuk klik kategori navbar
        $(".category-link").on("click", function (e) {
          e.preventDefault();
          const category = $(this).data("category");
          $("#query").val(category);
          $("#searchButton").click();
          $("html, body").animate(
            { scrollTop: $("#newsCards").offset().top - 70 },
            600
          );
        });

        // Muat berita default
        fetchNews("berita");
      });
    </script>
  </body>
</html>
